<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paskis - Comprobante de venta</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ff82b0; min-height: 100vh; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px 16px 48px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .acciones { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    button, .btn2 { border: 0; cursor: pointer; font-weight: 700; border-radius: 999px; font-family: inherit; font-size: 14px; text-decoration: none; }
    .btn { background: #fff; color: #e8508a; padding: 12px 26px; letter-spacing: 1px; box-shadow: 0 6px 16px rgba(0,0,0,.15); }
    .btn2 { background: rgba(255,255,255,.25); color: #fff; padding: 12px 20px; }
    .ayuda { color: #fff; font-size: 12px; opacity: .9; max-width: 340px; text-align: center; line-height: 1.4; }

    /* Ticket: 58 mm de papel, 48 mm de impresión */
    .ticket { width: 58mm; background: #fff; padding: 4mm 5mm 6mm; color: #000; font-family: "Courier New", Courier, monospace; font-size: 11px; line-height: 1.35; box-shadow: 0 8px 20px rgba(0,0,0,.18); }
    .ticket .logo { display: block; width: 36mm; margin: 0 auto 2mm; image-rendering: pixelated; }
    .c { text-align: center; }
    .b { font-weight: 700; }
    .titulo { font-size: 12px; font-weight: 700; letter-spacing: 1px; margin: 1mm 0; }
    .sep { border-top: 1px dashed #000; margin: 2mm 0; }
    .fila { display: flex; justify-content: space-between; gap: 2mm; }
    .fila span:last-child { text-align: right; white-space: nowrap; }
    .item { margin-bottom: 1.2mm; }
    .item .det { padding-left: 2mm; }
    .total { font-size: 14px; font-weight: 700; }
    .peq { font-size: 9.5px; }
    .msg { color: #fff; font-size: 15px; text-align: center; margin-top: 40px; }

    @page { size: 58mm auto; margin: 0; }
    @media print {
      html, body { background: #fff; padding: 0; margin: 0; display: block; min-height: 0; }
      .acciones, .ayuda { display: none !important; }
      .ticket { width: 48mm; padding: 0 0 6mm; margin: 0 auto; box-shadow: none; }
    }
  </style>
</head>
<body>

    <button class="btn" id="imprimir">IMPRIMIR</button>
    <a class="btn2" href="ventas.html">← Volver a ventas</a>

  // Datos del negocio que aparecen en el comprobante (se pueden completar más adelante)
  const NEGOCIO = { nombre: 'PASKIS COOKIES & CAKE', lineas: [] };

  await requerirSesion();
  const params = new URLSearchParams(location.search);
  const v = await obtener('ventas', params.get('id') || '-');
  if (!v) { $('contenido').innerHTML = '<div class="msg">No se encontró la venta.</div>'; $('imprimir').disabled = true; }
  else {
    const [a, m, d] = v.fecha.split('-');
    const hora = v.creado ? new Date(v.creado).toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', hour12: false }) : '';
    const numero = v.id.slice(-6).toUpperCase();
    const unidades = v.lineas.reduce((s, l) => s + l.cantidad, 0);
    $('contenido').innerHTML = `<div class="ticket">
      <img class="logo" src="${LOGO}" alt="Paskis">
      ${NEGOCIO.lineas.map(x => `<div class="c peq">${esc(x)}</div>`).join('')}
      <div class="sep"></div>
      <div class="c titulo">COMPROBANTE DE VENTA</div>
      <div class="c">N° ${numero}</div>
      <div class="sep"></div>
      <div class="fila"><span>Fecha:</span><span>${d}-${m}-${a} ${hora}</span></div>
      ${v.cliente ? `<div class="fila"><span>Cliente:</span><span>${esc(v.cliente)}</span></div>` : ''}

      ${v.lineas.map(l => `<div class="item">

  $('imprimir').addEventListener('click', () => window.print());
</script>
</body>
</html>
