<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paskis ERP - Menú</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      background: #ff82b0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 24px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .logo { width: min(80vw, 420px); height: auto; }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 120px);
      gap: 36px;
      justify-content: center;
    }
    @media (max-width: 640px) { .grid { grid-template-columns: repeat(2, 120px); } }
    .item {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      text-decoration: none; color: #fff;
    }
    .icon {
      width: 96px; height: 96px; background: #fff; border-radius: 22px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 20px rgba(0,0,0,.15);
      transition: transform .15s, box-shadow .15s;
    }
    .item:hover .icon { transform: translateY(-4px); box-shadow: 0 12px 26px rgba(0,0,0,.22); }
    .icon svg { width: 58px; height: 58px; fill: none; stroke: #e8508a; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .label { font-weight: 700; font-size: 13px; letter-spacing: 1.5px; text-align: center; }
    .volver { color: #fff; font-size: 14px; text-decoration: none; opacity: .9; }
    .sesion { color: #fff; font-size: 13px; opacity: .95; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
    .sesion button { background: rgba(255,255,255,.25); color: #fff; border: 0; border-radius: 999px; padding: 6px 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .sesion button:hover { background: rgba(255,255,255,.4); }
    body.cargando { visibility: hidden; }
    a.logo-link { display: inline-block; line-height: 0; transition: transform .15s; }
    a.logo-link:hover { transform: scale(1.04); }
  </style>
</head>
<body class="cargando">
  <a href="menu.html" class="logo-link" title="Ir al menú principal"><img class="logo" src="Dise%C3%B1o%20sin%20t%C3%ADtulo%20(17)%20(1).png" alt="Paskis"></a>
  <div class="grid">
    <a class="item" href="ventas.html">
      <div class="icon"><svg viewBox="0 0 24 24"><path d="M4 20h16"/><rect x="5" y="13" width="3" height="5"/><rect x="10.5" y="9" width="3" height="9"/><rect x="16" y="11" width="3" height="7"/><path d="M4 9l5-4 4 3 7-5"/><path d="M16 3h4v4"/></svg></div>
      <span class="label">VENTAS</span>
    </a>
    <a class="item" href="productos.html">
      <div class="icon"><svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M5 20v-7h14v7"/><path d="M5 16c2 1.5 3.5 1.5 5 0s3.5-1.5 5 0 3 1.5 4 0"/><path d="M8 13v-3h8v3"/><path d="M12 10V7"/><path d="M12 7c-1-1-1-2.5 0-4 1 1.5 1 3 0 4z"/></svg></div>
      <span class="label">PRODUCTOS</span>
    </a>
    <a class="item" href="inventario.html">
      <div class="icon"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8 12l3 3 6-7"/></svg></div>
      <span class="label">INVENTARIO</span>
    </a>
    <a class="item" href="#pedidos">
      <div class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18"/><path d="M8 3v4M16 3v4"/><path d="M7 14h2M11 14h2M15 14h2M7 17.5h2M11 17.5h2"/></svg></div>
      <span class="label">PEDIDOS<br>AGENDADOS</span>
    </a>
  </div>
  <div class="sesion"><span id="usuario"></span><button id="salir">Cerrar sesión</button></div>
<script type="module">
  import { requerirSesion, salir, migrarLocal } from './datos.js';
  const u = await requerirSesion();
  document.body.classList.remove('cargando');
  document.getElementById('usuario').textContent = u.email;
  document.getElementById('salir').onclick = salir;
  try { if (await migrarLocal()) alert('Listo, tus datos ya están guardados en la nube.'); } catch (e) { alert('No se pudieron subir los datos del navegador: ' + e.message); }
</script>
</body>
</html>
