<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paskis ERP - Inventario</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ff82b0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; padding: 24px 16px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logo { width: min(70vw, 320px); height: auto; }
    h1 { color: #fff; letter-spacing: 3px; font-size: 24px; }
    .grid { display: grid; grid-template-columns: repeat(2, 150px); gap: 40px; justify-content: center; }
    .item { display: flex; flex-direction: column; align-items: center; gap: 12px; text-decoration: none; color: #fff; }
    .icon { width: 110px; height: 110px; background: #fff; border-radius: 24px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,.15); transition: transform .15s, box-shadow .15s; }
    .item:hover .icon { transform: translateY(-4px); box-shadow: 0 12px 26px rgba(0,0,0,.22); }
    .icon svg { width: 62px; height: 62px; fill: none; stroke: #e8508a; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .label { font-weight: 700; font-size: 14px; letter-spacing: 1.5px; text-align: center; }
    .volver { color: #fff; font-size: 14px; text-decoration: none; opacity: .9; }
  </style>
</head>
<body>
  <img class="logo" src="Dise%C3%B1o%20sin%20t%C3%ADtulo%20(17)%20(1).png" alt="Paskis">
  <h1>INVENTARIO</h1>
  <div class="grid">
    <a class="item" href="productos-terminados.html">
      <div class="icon"><svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M5 20v-7h14v7"/><path d="M5 16c2 1.5 3.5 1.5 5 0s3.5-1.5 5 0 3 1.5 4 0"/><path d="M8 13v-3h8v3"/><path d="M12 10V7"/><path d="M12 7c-1-1-1-2.5 0-4 1 1.5 1 3 0 4z"/></svg></div>
      <span class="label">PRODUCTOS<br>TERMINADOS</span>
    </a>
    <a class="item" href="ingredientes.html">
      <div class="icon"><svg viewBox="0 0 24 24"><path d="M6 8h12l-1.2 12a1.5 1.5 0 0 1-1.5 1.3H8.7a1.5 1.5 0 0 1-1.5-1.3z"/><path d="M5 8h14"/><path d="M8 8c0-2.5 1.8-4.5 4-4.5s4 2 4 4.5"/><path d="M9 13h6M9.5 16.5h5"/></svg></div>
      <span class="label">INGREDIENTES</span>
    </a>
  </div>
  <a class="volver" href="menu.html">← Volver al menú</a>
</body>
</html>
